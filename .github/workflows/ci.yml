name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Node ${{ matrix.node }} and Bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: TypeScript 7, lint, format, Bun tests, build and packed consumers
        run: bun run check
      - name: Run the same runtime suite under Node
        # Keep SDK module startup from competing with other files' short deadline fixtures.
        run: node --no-warnings --experimental-strip-types --experimental-loader ./scripts/node-test-loader.mjs --test --test-concurrency=1 --test-timeout=5000 tests/*.test.ts
      - name: Produce installable package
        if: matrix.node == '24'
        run: bun pm pack --filename questions.tgz
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: questions-package
          path: questions.tgz

  zod-minimum:
    name: Minimum Zod 4 peer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun add --dev --exact zod@4.0.0
      - name: Types, runtime and installed package against minimum peer
        # Optional AI SDK integrations require Zod >=4.1.8; this job validates the native package peer.
        run: bun run typecheck && bun test tests/jev.test.ts tests/providers-http.test.ts tests/schema.test.ts tests/questions.test.ts tests/streams.test.ts tests/evidence.test.ts tests/replay.test.ts tests/diagnostics.test.ts tests/lifecycle.test.ts tests/probability-source.test.ts tests/policy.test.ts tests/branching.test.ts && bun run build && bun run test:package:native

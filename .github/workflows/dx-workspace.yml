name: Validate semantic deadline regressions
on:
  push:
    branches: [feat/semantic-dx]
    paths: [.github/workflows/dx-workspace.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Verify and apply context regression patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          sha = '55eb20f8af527e732b51fcf338a38e29d51bc6d5'
          req = urllib.request.Request('https://api.github.com/repos/nitoba/questions/git/blobs/' + sha,
            headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req) as response:
            content = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(f'blob {len(content)}\0'.encode() + content).hexdigest() == sha
          pathlib.Path('/tmp/semantic-regression.patch').write_bytes(content)
          PY
          git apply --check /tmp/semantic-regression.patch
          git apply /tmp/semantic-regression.patch
      - name: Validate all contracts and installed consumers
        run: |
          set -o pipefail
          bun run check 2>&1 | tee /tmp/semantic-regression.log
          node --no-warnings --experimental-strip-types --experimental-loader ./scripts/node-test-loader.mjs --test --test-timeout=5000 tests/*.test.ts 2>&1 | tee /tmp/semantic-regression-node.log
      - name: Commit validated regressions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/questions.ts tests/lifecycle.test.ts
          git commit -m 'fix: validate context and deadline before counting provider dispatch'
          git push origin HEAD:feat/semantic-dx
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-regression-validation
          path: /tmp/semantic-regression*.log
          if-no-files-found: ignore
          retention-days: 1

name: Validate HTTP and replay integration
on:
  push:
    branches: [feat/ofetch-retry-replay]
    paths: [.github/workflows/http-workspace.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install exact baseline dependency
        run: bun install --frozen-lockfile && bun add --exact ofetch@1.5.0
      - name: Reconstruct and verify reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          shas = [
            '5ef8aa0e4d641594b4c1633bfec3b188eb508a76',
            '4636bf56d9f15301d4e6ab128c2a6ab33b5e5f3e',
            '98e649b591cf570a022acc8eead591abded5f554',
            '31f41f69149b9c90fe292889eed768f0d8c754c4',
            '1dab11b165dcc48aff6a2108c6053bee3a6b7737',
            'a79bbf28eedd5d816e990b1acd7061e5d4a6fc84',
            '32898a1ba575259b3e7924b4432ae57973f806c1',
            '3e1091ffc8ad16ca24f27b443dba4a179c82d932',
            '90b29c39b16fc8143461ed32ebd82253b0370d1b',
            'ae2c50dbc1f93528a894d13ab1bd20beda8a1979',
            '86f0f7d5dbb8feb597cec135b4e19c34d0502c0a',
          ]
          parts = []
          for sha in shas:
            request = urllib.request.Request(
              'https://api.github.com/repos/nitoba/questions/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
            )
            with urllib.request.urlopen(request) as response:
              part = base64.b64decode(json.load(response)['content'])
            assert hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest() == sha
            parts.append(part)
          patch = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == '65e2014d7d059f998b430101dca57444462b1249bd922fb72dc53b616da61219'
          pathlib.Path('/tmp/http.patch').write_bytes(patch)
          PY
          git apply --check /tmp/http.patch
          git apply /tmp/http.patch
      - name: Validate frozen installation, types, lint, format, tests and packed consumers
        run: |
          set -o pipefail
          bun install --frozen-lockfile
          bun run format
          bun run check 2>&1 | tee /tmp/http-check.log
          node --no-warnings --experimental-strip-types --experimental-loader ./scripts/node-test-loader.mjs --test --test-timeout=5000 tests/*.test.ts 2>&1 | tee /tmp/http-node.log
      - name: Commit validated implementation and documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Workflow edits are committed separately through the repository connector.
          git restore --source=HEAD --staged --worktree .github/workflows/ci.yml
          git add src tests scripts package.json bun.lock
          git commit -m 'feat(http): integrate ofetch retries and typed evaluation replay'
          git add README.md AGENTS.md CHANGELOG.md docs examples
          git commit -m 'docs: explain retries, replay and ofetch-inspired opportunities'
          git push origin HEAD:feat/ofetch-retry-replay
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-replay-validation
          path: /tmp/http-*.log
          if-no-files-found: ignore
          retention-days: 1

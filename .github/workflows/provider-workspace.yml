name: Provider validation workspace
on:
  push:
    branches: [feat/multi-provider]
    paths: [.github/workflows/provider-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun add --dev --exact @ai-sdk/gateway @ai-sdk/provider
      - name: Export source and toolchain without credentials
        run: |
          mkdir .validation-tools
          cp "$(command -v bun)" .validation-tools/bun
          tar --exclude='./.git' -czf /tmp/questions-providers.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: questions-provider-workspace
          path: /tmp/questions-providers.tgz
          retention-days: 1

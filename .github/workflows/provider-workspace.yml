name: Validate multi-provider integration
on:
  push:
    branches: [feat/multi-provider]
    paths: [.github/workflows/provider-workspace.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Reconstruct and verify reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          shas = [
            'e1d005d57d3ad6526bb13fea6a7b09640717c60b',
            '881926d420b2364d03c3e8a554f9b0731aea54d4',
            '598537def56d14402f90843766f4cfdddf00abc2',
            '6e7cb2fff40978918f1c9237b4b213e0010c2445',
            'd64877cd09da7f703b9271d2d0d6a47f73bd6457',
          ]
          parts = []
          for sha in shas:
            request = urllib.request.Request(
              'https://api.github.com/repos/nitoba/questions/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
            )
            with urllib.request.urlopen(request) as response:
              data = json.load(response)
            parts.append(base64.b64decode(data['content']))
          # Restore a transfer-encoding omission; verify the exact original blob and patch.
          encoded = base64.b64encode(parts[0]).decode().rstrip('=')
          parts[0] = base64.b64decode(encoded[:562] + 'x' + encoded[562:-1] + 'f', validate=True)
          assert hashlib.sha1(b'blob 6000\0' + parts[0]).hexdigest() == 'd96b2baaf06ef74e8ffb67f3784d281099f0d86e'
          compressed = b''.join(parts)
          pathlib.Path('/tmp/providers.gz').write_bytes(compressed)
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '1a3fa7be393e793e89f515b233f4f3262d401dc3949a3f8b44c61ec357b08f2d', 'Patch integrity mismatch'
          pathlib.Path('/tmp/providers.patch').write_bytes(patch)
          PY
          git apply --check /tmp/providers.patch
          git apply --index /tmp/providers.patch
      - name: Install exact development versions and update the lockfile
        run: bun install --ignore-scripts && bun install --frozen-lockfile
      - name: Validate types, lint, format, runtime, build and installed packages
        run: |
          set -o pipefail
          bun run format
          bun run check 2>&1 | tee /tmp/providers-check.log
          node --no-warnings --experimental-strip-types --experimental-loader ./scripts/node-test-loader.mjs --test --test-timeout=5000 tests/*.test.ts 2>&1 | tee /tmp/providers-node.log
      - name: Commit validated source and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'feat(providers): add optional Vercel evaluation and validated AI SDK bridge'
          git push origin HEAD:feat/multi-provider
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git hash-object bun.lock >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-validation-evidence
          path: |
            /tmp/providers-*.log
            /tmp/providers.gz
          if-no-files-found: ignore
          retention-days: 1

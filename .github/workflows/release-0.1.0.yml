name: Release 0.1.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-0.1.0.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-0.1.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'nitoba/questions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Verify source and registry before preparing the stable release
        env:
          EXPECTED_BASE: 2de6f46e3c16083bade8ee814c1a08dcfb57ebc4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(node -p "require('./package.json').version")" = "0.1.0-rc.3"
          if git rev-parse --verify refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; refusing to replace it." >&2
            exit 1
          fi
          npm view @nitoba/questions versions --json > "$RUNNER_TEMP/questions-versions.json"
          npm view @nitoba/questions dist-tags --json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const versions = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/questions-versions.json`, "utf8"));
          if ([versions].flat().includes("0.1.0")) {
            throw new Error("0.1.0 is already published; refusing to reuse a version.");
          }
          NODE

      - name: Prepare version, release notes and current installation documentation
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, unlinkSync } from "node:fs";
          const replace = (file, before, after) => {
            const text = readFileSync(file, "utf8");
            if (!text.includes(before)) throw new Error(`Expected release text missing in ${file}`);
            writeFileSync(file, text.replace(before, after));
          };
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          pkg.version = "0.1.0";
          pkg.publishConfig.tag = "latest";
          pkg.scripts["release:dry-run"] = "npm publish --dry-run --access public --tag latest";
          writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

          replace("CHANGELOG.md", "## Unreleased — policies and descriptive routing", "## 0.1.0 — 2026-09-22");
          replace("CHANGELOG.md", "- No dependency, package-version or publication changes.", "- Publish the first stable release with npm dist-tag `latest`, including policies and descriptive routing. No runtime dependencies were added.");
          replace("README.md",
            "> **Release status:** the published baseline is `0.1.0-rc.3`. Sections marked **unreleased**\n> describe additive development APIs available in this checkout, not in that npm release.\n> Existing release-candidate calls retain their contracts. Decisions are finite classifications, not arbitrary JSON generation, factual guarantees\n> or authorization to execute business actions. See the [changelog](CHANGELOG.md) and\n> [migration guide](docs/migration.md) before upgrading.",
            "> **Stable release:** `0.1.0` includes ordered policies and descriptive routing and is distributed through the npm `latest` tag.\n> Existing release-candidate calls retain their contracts. Decisions are finite classifications, not arbitrary JSON generation, factual guarantees\n> or authorization to execute business actions. See the [changelog](CHANGELOG.md) and\n> [migration guide](docs/migration.md) before upgrading.");
          replace("README.md",
            "Install the published release candidate from npm. The `next` dist-tag tracks the current prerelease:",
            "Install the stable release from npm. These commands resolve the `latest` dist-tag:");
          replace("docs/policies.md",
            "**Unreleased:** these APIs are available in this checkout, not in the published `0.1.0-rc.3`\npackage.",
            "**Available since 0.1.0:** ordered policies and descriptive routing are included in the stable npm package.");
          replace("examples/README.md",
            "Lessons 01–17 target the **0.1.0-rc.3** baseline. Lesson 18 uses the **unreleased** policy and\ndescriptive-routing APIs in this checkout; it is not compatible with the published rc.3 package.\nRun the learning path against this repository's source.",
            "Lessons 01–18 target **0.1.0**, including the stable policy and descriptive-routing APIs.\nRun the learning path against this repository's source.");
          for (const file of ["README.md", "docs/policies.md", "docs/architecture.md", "docs/semantic-dx.md", "examples/README.md"]) {
            const text = readFileSync(file, "utf8")
              .replaceAll(" (unreleased)", "")
              .replaceAll("#policies-unreleased", "#policies");
            writeFileSync(file, text);
          }
          writeFileSync("docs/releasing.md", [
            "# Releasing Questions",
            "",
            "This repository publishes `@nitoba/questions` as a public scoped package. Stable releases use the npm `latest` dist-tag; release candidates use `next`. The first stable release is `0.1.0`.",
            "",
            "## Release checklist",
            "",
            "1. Confirm the release source passes Node 22, Node 24, Bun, the minimum native Zod peer, installed-package smoke tests, README snippets, and documentation links.",
            "2. Update `package.json`, `CHANGELOG.md`, and any versioned documentation. Stable versions use `x.y.z` without a prerelease suffix.",
            "3. Run `bun install --frozen-lockfile` and `bun run check`.",
            "4. Run `bun run release:dry-run` and inspect the package contents. The stable checkout uses `--tag latest`; use an explicit `--tag next` when preparing a release candidate.",
            "5. Merge or fast-forward the validated release commit to `main`.",
            "6. Create and push a Git tag that exactly matches `v` plus the package version.",
            "7. Wait for **Publish to npm** to pass, then verify the version and dist-tags in the npm registry.",
            "",
            "## npm Trusted Publishing",
            "",
            "The existing Trusted Publisher configuration uses GitHub user `nitoba`, repository `questions`, workflow filename `publish.yml`, and no GitHub environment. The filename is case-sensitive and does not include `.github/workflows/`.",
            "",
            "The workflow uses a GitHub-hosted runner, Node 24/npm 11, and `id-token: write`. npm exchanges that OIDC identity for short-lived publishing credentials. No long-lived npm write token is required. Keep publication in `publish.yml` so it continues to match the configured publisher.",
            "",
            "## Tag-triggered publication",
            "",
            "The workflow accepts `v*` tags only when the tag matches `package.json` and points to a commit contained in `main`. Versions shaped as `x.y.z` publish with `latest`; `x.y.z-rc.N` publishes with `next`. Other prerelease shapes are rejected.",
            "",
            "For version `0.1.0`, after the validated release commit reaches `main`:",
            "",
            "```sh",
            "git switch main",
            "git pull --ff-only origin main",
            "git tag v0.1.0",
            "git push origin v0.1.0",
            "```",
            "",
            "Do not repeat those tag commands after the release already exists. A pushed tag normally starts **Publish to npm** automatically. A tag created by another workflow using `GITHUB_TOKEN` does not emit a new workflow run; that workflow must explicitly dispatch `publish.yml` with `release_tag=v0.1.0` instead.",
            "",
            "The effective stable publication command is:",
            "",
            "```sh",
            "npm publish --access public --tag latest",
            "```",
            "",
            "`prepublishOnly` runs the full validation gate before npm receives the package. Do not skip it during publication. An `ENEEDAUTH` error can indicate mismatched Trusted Publisher settings or unavailable OIDC permissions.",
            "",
            "## Verify publication",
            "",
            "```sh",
            "npm view @nitoba/questions version",
            "npm view @nitoba/questions dist-tags --json",
            "npm install @nitoba/questions zod",
            "```",
            "",
            "For this release, both the default version and `dist-tags.latest` must resolve to `0.1.0`. An older version may remain under `next`; that does not affect normal installation. Do not reuse a published version, move an existing release tag, or publish an uncommitted working tree. Ordinary source changes do not publish automatically.",
            "",
          ].join("\n"));
          // Remove this one-off release launcher from the release commit.
          // The existing tag/dispatch-based publish.yml remains unchanged.
          unlinkSync(".github/workflows/release-0.1.0.yml");
          NODE
          git diff --stat
          if git grep -n -i unreleased -- README.md docs/policies.md docs/architecture.md docs/semantic-dx.md examples/README.md; then
            echo "Unreleased markers remain in the current documentation." >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run format

      - name: Validate the stable release with Node 22 and Bun
        run: |
          set -euo pipefail
          bun run check
          node --no-warnings --experimental-strip-types --experimental-loader ./scripts/node-test-loader.mjs --test --test-concurrency=1 --test-timeout=5000 tests/*.test.ts

      - name: Validate minimum native Zod peer without changing the release manifest
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/questions-release-package.json"
          cp bun.lock "$RUNNER_TEMP/questions-release-bun.lock"
          trap 'cp "$RUNNER_TEMP/questions-release-package.json" package.json; cp "$RUNNER_TEMP/questions-release-bun.lock" bun.lock' EXIT
          bun add --dev --exact zod@4.0.0
          bun run typecheck
          bun test tests/jev.test.ts tests/providers-http.test.ts tests/schema.test.ts tests/questions.test.ts tests/streams.test.ts tests/evidence.test.ts tests/replay.test.ts tests/diagnostics.test.ts tests/lifecycle.test.ts tests/probability-source.test.ts tests/policy.test.ts tests/branching.test.ts
          bun run build
          bun run test:package:native

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Validate the stable release with Node 24 and Bun
        run: |
          set -euo pipefail
          bun run check
          node --no-warnings --experimental-strip-types --experimental-loader ./scripts/node-test-loader.mjs --test --test-concurrency=1 --test-timeout=5000 tests/*.test.ts

      - name: Inspect the stable package without publishing
        run: bun run release:dry-run

      - name: Commit only validated release metadata and create the immutable tag
        id: commit
        run: |
          set -euo pipefail
          git diff --check
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const allowed = new Set([
            "package.json", "CHANGELOG.md", "README.md", "docs/releasing.md",
            "docs/policies.md", "docs/architecture.md", "docs/semantic-dx.md",
            "examples/README.md", ".github/workflows/release-0.1.0.yml",
          ]);
          const changed = execFileSync("git", ["diff", "--name-only"], { encoding: "utf8" }).trim().split("\n");
          for (const path of changed) {
            if (!allowed.has(path)) throw new Error(`Unexpected release change: ${path}`);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: release 0.1.0 on npm latest"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git tag v0.1.0 "$RELEASE_SHA"
          git push origin refs/tags/v0.1.0
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch the existing OIDC publisher and wait for its result
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref main --field release_tag=v0.1.0
          RUN_ID=""
          for attempt in $(seq 1 24); do
            RUN_ID="$(gh run list --workflow publish.yml --event workflow_dispatch --commit "$RELEASE_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "Publisher was dispatched but its run could not be located." >&2
            exit 1
          fi
          echo "Publisher run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 5

      - name: Verify latest and the actual default npm installation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            LATEST="$(npm view @nitoba/questions dist-tags.latest)"
            if [[ "$LATEST" == "0.1.0" ]]; then break; fi
            sleep 5
          done
          test "$LATEST" = "0.1.0"
          npm view @nitoba/questions version dist-tags --json
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          printf '{"name":"questions-stable-install-check","private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund @nitoba/questions zod
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import { Policy, Questions, Question } from "@nitoba/questions";
          const require = createRequire(import.meta.url);
          const pkg = require("@nitoba/questions/package.json");
          if (pkg.version !== "0.1.0") throw new Error(`Default install resolved ${pkg.version}`);
          if (typeof Policy.from !== "function" || typeof Questions.create !== "function" || typeof Question.boolean !== "function") {
            throw new Error("Expected stable runtime exports are missing.");
          }
          console.log(`Verified default npm installation: ${pkg.name}@${pkg.version}, including Policy.`);
          NODE

      - name: Create the stable GitHub release after npm verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const notes = changelog.split("## 0.1.0 — 2026-09-22\n\n")[1]?.split("\n## ")[0];
          if (!notes) throw new Error("Stable release notes are missing.");
          writeFileSync(`${process.env.RUNNER_TEMP}/questions-release-notes.md`, notes + "\n\nInstall: `npm install @nitoba/questions zod` or `bun add @nitoba/questions zod`.\n\nnpm dist-tag: **latest**.\n");
          NODE
          gh release create v0.1.0 --verify-tag --title "@nitoba/questions 0.1.0" --notes-file "$RUNNER_TEMP/questions-release-notes.md" --latest
          printf '## Published\n\n`@nitoba/questions@0.1.0` is available through `latest`.\n\nValidated Node 22, Node 24, Bun, minimum Zod, package dry-run and a clean default npm installation.\n' >> "$GITHUB_STEP_SUMMARY"

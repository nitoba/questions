name: Tag rc3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tag-rc3.yml

permissions:
  contents: write
  actions: write

env:
  RELEASE_TAG: v0.1.0-rc.3

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release tag exists and dispatch publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            RELEASE_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          else
            RELEASE_COMMIT="$(git rev-parse HEAD^)"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "$RELEASE_TAG"
          fi

          VERSION="$(git show "$RELEASE_COMMIT:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          test "v$VERSION" = "$RELEASE_TAG"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches \
            --data '{"ref":"main","inputs":{"release_tag":"v0.1.0-rc.3"}}'

name: Bootstrap toolchain
on:
  push:
    paths: [".github/workflows/bootstrap.yml"]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Resolve exact toolchain and lock dependencies
        run: |
          bun add --dev --exact @types/bun typescript@7.0.2 oxlint@1.83.0 oxfmt@0.66.0 tsdown@0.23.0 publint
          bun --version
          bun run tsc --version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: lock Bun dependencies and exact development toolchain"
          git pull --rebase origin main
          git push origin HEAD:main

name: Validate schema integration
on:
  push:
    branches: [feat/zod-schemas]
    paths: [.github/workflows/dev-environment.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zod-schemas
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Verify and apply reviewed source patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''.join(pathlib.Path(f'.integration/schema.part{i}').read_text().strip() for i in range(3))
          encoded = encoded.replace('P2T8J8JkRequ3', 'P2T8JkRequ3')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '64af50709c7c53189678764ddecd4e5e3fd06e9abcf61ef7a72508d28914e980'
          pathlib.Path('/tmp/schema.patch').write_bytes(patch)
          PY
          git apply --index /tmp/schema.patch
          git rm .integration/schema.part0 .integration/schema.part1 .integration/schema.part2
      - run: bun install --frozen-lockfile
      - name: Validate TypeScript, lint, tests, build and installed tarball
        run: |
          bun run format
          set -o pipefail
          bun run check 2>&1 | tee /tmp/schema-validation.log
          node --no-warnings --experimental-strip-types --experimental-loader ./scripts/node-test-loader.mjs --test --test-timeout=5000 tests/*.test.ts 2>&1 | tee /tmp/schema-node.log
      - name: Commit validated implementation
        run: |
          git config user.name 'Bruno Alves'
          git config user.email '38570443+nitoba@users.noreply.github.com'
          git commit -m 'feat(schema): integrate Zod validation, metadata and typed decisions'
          git push origin HEAD:feat/zod-schemas
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-validation-logs
          path: /tmp/schema-*.log
          if-no-files-found: ignore
          retention-days: 1

name: Integration development environment
on:
  push:
    branches: [feat/zod-schemas]
    paths: [.github/workflows/dev-environment.yml]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun add --dev --exact 'zod@^4.0.0'
      - name: Export isolated development toolchain
        run: |
          mkdir .validation-tools
          cp "$(command -v bun)" .validation-tools/bun
          tar --exclude='./.git' -czf /tmp/questions-validation.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: questions-validation-environment
          path: /tmp/questions-validation.tgz
          retention-days: 1

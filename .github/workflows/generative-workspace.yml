name: Generative declaration prerequisites
on:
  push:
    branches: [feat/generative-provider]
    paths: [.github/workflows/generative-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun add --dev --exact ai@7.0.105 @ai-sdk/google@4.0.74 @ai-sdk/anthropic@4.0.56 @ai-sdk/openai@4.0.69 @types/json-schema@7.0.15
      - name: Export declaration prerequisites and lockfile
        run: tar -hczf /tmp/questions-generative-types.tgz package.json bun.lock node_modules/@types/json-schema
      - uses: actions/upload-artifact@v4
        with:
          name: questions-generative-types
          path: /tmp/questions-generative-types.tgz
          retention-days: 1

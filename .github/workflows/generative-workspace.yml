name: Generative provider workspace
on:
  push:
    branches: [feat/generative-provider]
    paths: [.github/workflows/generative-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun add --dev --exact ai@7.0.105 @ai-sdk/google @ai-sdk/anthropic @ai-sdk/openai
      - name: Export source and isolated toolchain without credentials
        run: |
          mkdir .validation-tools
          cp "$(command -v bun)" .validation-tools/bun
          tar --exclude='./.git' -czf /tmp/questions-generative.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: questions-generative-workspace
          path: /tmp/questions-generative.tgz
          retention-days: 1

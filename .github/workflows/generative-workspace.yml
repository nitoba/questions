name: Validate generative provider
on:
  push:
    branches: [feat/generative-provider]
    paths: [.github/workflows/generative-workspace.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Verify and apply reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          shas = [
            '909d992a291616f4801668219770808bf5e9b03d',
            'fc01152c3264dc3cfb2be70141df2e9b902d7fd5',
            '5607d0b5883754d83cafe20933171ec5333af2be',
            '25bb3b856c66ebba7d36abdc4652fcb37939aad2',
            'b4ce12acc89784fd410b2717f0fb2bf620648a1b',
            '15ec3f798b7d59e841c83170654efa3572ee0766',
            '309316435e12fc4f525f265df48739ef81f4489c',
          ]
          parts = []
          for sha in shas:
            request = urllib.request.Request(
              'https://api.github.com/repos/nitoba/questions/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
            )
            with urllib.request.urlopen(request) as response:
              data = json.load(response)
            content = base64.b64decode(data['content'])
            assert hashlib.sha1(f'blob {len(content)}\0'.encode() + content).hexdigest() == sha
            parts.append(content)
          patch = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == '72bd0f127793f1cf61c66091158052f7c4ca222912817fbb004e1b53826bd1aa'
          pathlib.Path('/tmp/generative.patch').write_bytes(patch)
          PY
          git apply --check /tmp/generative.patch
          git apply --index /tmp/generative.patch
      - run: bun install --frozen-lockfile
      - name: Validate types, 286 Bun tests, lint, build and installed packages
        run: |
          set -o pipefail
          bun run check 2>&1 | tee /tmp/generative-check.log
      - name: Run the 267 core tests on Node
        run: |
          set -o pipefail
          node --no-warnings --experimental-strip-types --experimental-loader ./scripts/node-test-loader.mjs --test --test-concurrency=1 --test-timeout=5000 tests/*.test.ts 2>&1 | tee /tmp/generative-node.log
      - name: Commit validated implementation, tests and documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset
          git add src package.json bun.lock tsdown.config.ts
          git commit -m 'feat(providers): add estimated generative decisions through AI SDK'
          git add tests scripts
          git commit -m 'test(generative): cover SDK transports, validation and installed consumers'
          git add docs examples README.md CHANGELOG.md AGENTS.md
          git commit -m 'docs(generative): add multi-provider tutorial and probability provenance guide'
          git diff --exit-code
          git push origin HEAD:feat/generative-provider
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generative-validation-evidence
          path: /tmp/generative-*.log
          if-no-files-found: ignore
          retention-days: 1

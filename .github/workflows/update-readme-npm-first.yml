name: Update npm-first README

on:
  push:
    branches:
      - docs/npm-first-readme
    paths:
      - .github/scripts/update-readme-npm-first.mjs
      - .github/workflows/update-readme-npm-first.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/npm-first-readme

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: node .github/scripts/update-readme-npm-first.mjs
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run test:docs

      - name: Commit validated README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/update-readme-npm-first.mjs .github/workflows/update-readme-npm-first.yml
          git add README.md
          git commit -m 'docs: make npm installation the primary quick start'
          git push origin HEAD:docs/npm-first-readme

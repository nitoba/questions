name: Refresh install docs

on:
  push:
    branches:
      - docs/unpinned-installs
    paths:
      - .github/workflows/refresh-install-docs.yml

permissions:
  contents: write

jobs:
  refresh:
    # Temporary validation workflow for the dependency-documentation refresh.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/unpinned-installs

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: node .github/scripts/refresh-install-docs.mjs
      - run: bun add --dev --exact zod@latest
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run check

      - name: Commit validated documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs examples package.json bun.lock CHANGELOG.md
          git commit -m 'docs: let package managers resolve current dependencies'
          git push origin HEAD:docs/unpinned-installs
